name: Build KTBFX web app for GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/**'
      - '.github/workflows/web-app.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ktbfx-web-pages
  cancel-in-progress: false

jobs:
  build-web:
    name: Export the usable KTBFX app to docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Export Expo app for the web
        run: npx expo export --platform web --output-dir docs

      - name: Commit the web app for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Publish usable KTBFX web app"
            git push
          else
            echo "The published web app is already up to date."
          fi
