name: Build and publish KTBFX Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ktbfx-android-release
  cancel-in-progress: false

jobs:
  build:
    name: Validate, build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply compatible dependency security fixes
        run: npm audit fix --no-fund || echo "Some moderate advisories have no compatible automatic fix; the high-severity gate runs next."

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Expo configuration
        run: npx expo config --json > expo-config.json

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Link or initialize the EAS project
        run: |
          if ! node -e "const c=require('./app.json').expo; process.exit(c.extra?.eas?.projectId ? 0 : 1)"; then
            eas init --account freddiv1117 --non-interactive
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build signed Android APK
        run: eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'

      - name: Download and verify APK
        run: |
          BUILD_URL="$(node -e "const x=require('./eas-build.json'); const b=Array.isArray(x)?x[0]:x; process.stdout.write(b.artifacts?.buildUrl || '')")"
          test -n "$BUILD_URL"
          curl --fail --location --retry 3 "$BUILD_URL" --output KTBFX-2.0.0.apk
          test -s KTBFX-2.0.0.apk
          sha256sum KTBFX-2.0.0.apk | tee KTBFX-2.0.0.apk.sha256
          file KTBFX-2.0.0.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KTBFX-2.0.0-Android-APK
          path: |
            KTBFX-2.0.0.apk
            KTBFX-2.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ktbfx-v2.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" KTBFX-2.0.0.apk KTBFX-2.0.0.apk.sha256 --clobber
          else
            gh release create "$TAG" KTBFX-2.0.0.apk KTBFX-2.0.0.apk.sha256 \
              --title "KTBFX 2.0.0 — Android" \
              --notes "Nueva compilación de KTBFX 2.0.0. Incluye ajustes de privacidad, reducción de permisos Android, retirada del navegador web integrado y avisos de entrenamiento seguro. APK generado mediante Expo EAS. Revisa el checksum SHA-256 antes de instalar."
          fi
