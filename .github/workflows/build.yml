name: Build KTBFX Android APK (Expo EAS)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'assets/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: ktbfx-eas-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android APK with Expo
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build APK with the project's Expo credentials
        run: eas build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
